version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - ACTIVE_PROVIDER=${ACTIVE_PROVIDER:-groq}
      - QUALITY_THRESHOLD=0.82
    volumes:
      - ./adaptiveroute.db:/app/adaptiveroute.db
      - ./ml/models/trained:/app/ml/models/trained
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
