<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7000FF" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0A0B0E" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  <!-- Circuit routing paths -->
  <path d="M 12 32 H 24 L 32 18 H 52" stroke="url(#glowGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonBlur)" />
  <path d="M 24 32 L 32 46 H 52" stroke="url(#glowGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
  <path d="M 24 32 H 48" stroke="url(#glowGrad)" stroke-width="2" stroke-linecap="round" opacity="0.4" stroke-dasharray="3 3" />
  <!-- Routing nodes -->
  <circle cx="14" cy="32" r="3.5" fill="#00F0FF" />
  <circle cx="32" cy="18" r="3" fill="#7000FF" />
  <circle cx="32" cy="46" r="3" fill="#FF007A" />
  <circle cx="50" cy="18" r="3.5" fill="#00F0FF" />
  <circle cx="50" cy="46" r="3.5" fill="#FF007A" />
</svg>
